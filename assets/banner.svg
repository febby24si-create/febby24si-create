<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#0D0D0D"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.35"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1A1A1A" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)" opacity="0.5"/>

  <line x1="0" y1="0" x2="1200" y2="0" stroke="#222222" stroke-width="1"/>
  <line x1="0" y1="319" x2="1200" y2="319" stroke="#222222" stroke-width="1"/>

  <text x="80" y="150" font-family="JetBrains Mono, Menlo, monospace" font-size="56" fill="url(#fade)" font-weight="600">
    Fahrezy
  </text>
  <text x="80" y="195" font-family="JetBrains Mono, Menlo, monospace" font-size="20" fill="#8A8A8A">
    Full Stack Developer — System Information
  </text>

  <circle cx="1100" cy="80" r="3" fill="#FFFFFF"/>
  <circle cx="1130" cy="120" r="2" fill="#555555"/>
  <circle cx="1080" cy="160" r="2" fill="#555555"/>

  <text x="80" y="250" font-family="JetBrains Mono, Menlo, monospace" font-size="14" fill="#4D4D4D">
    &lt;/&gt; building for the long run
  </text>
