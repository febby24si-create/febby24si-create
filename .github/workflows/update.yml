name: Update Dynamic Quote

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: {}

jobs:
  update-quote:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Update quote block in README
        uses: piedcipher/quotes-github-readme@main
        with:
          COMMIT_MESSAGE: "chore: update daily quote"
